<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Imbumba Radiology Imaging{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

   <nav class="bg-white shadow-md fixed top-0 left-0 w-full z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">

            <div class="flex items-center">
                <a href="/" class="text-2xl font-bold text-blue-700">Imbumba Radiology Imaging</a>
            </div>

            <!-- Desktop Menu -->
            <div class="hidden md:flex space-x-8 items-center">
                <a href="/" class="text-gray-700 hover:text-blue-700">Home</a>
                <a href="/services/" class="text-gray-700 hover:text-blue-700">Services</a>
                <a href="/appointments/" class="text-gray-700 hover:text-blue-700">Appointments</a>
                <a href="/contact/" class="text-gray-700 hover:text-blue-700">Contact</a>
            </div>

            <!-- Mobile Menu Button -->
            <div class="md:hidden flex items-center">
                <button id="mobile-menu-btn" class="focus:outline-none">
                    <svg class="w-8 h-8 text-gray-800" fill="none" stroke="currentColor" stroke-width="2"
                         viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-white border-t shadow-md">
        <a href="/" class="block px-4 py-3 text-gray-700 hover:bg-gray-100">Home</a>
        <a href="/services/" class="block px-4 py-3 text-gray-700 hover:bg-gray-100">Services</a>
        <a href="/appointments/" class="block px-4 py-3 text-gray-700 hover:bg-gray-100">Appointments</a>
        <a href="/contact/" class="block px-4 py-3 text-gray-700 hover:bg-gray-100">Contact</a>
    </div>
</nav>

<!-- Add small script for mobile toggle -->
<script>
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');

    btn.addEventListener('click', () => {
        menu.classList.toggle('hidden');
    });
</script>

    <!-- Page Content -->
    <main class="pt-20">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-blue-900 text-white text-center py-6 mt-10">
        <p>&copy; 2025 Imbumba Radiology Imaging. All rights reserved.</p>
    </footer>

</body>
</html>
