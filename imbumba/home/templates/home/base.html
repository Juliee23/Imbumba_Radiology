<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Imbumba Radiology Imaging{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-700">Imbumba Radiology Imaging</h1>
            <nav class="space-x-6">
                <a href="/" class="hover:text-blue-600">Home</a>
                <a href="/services/" class="hover:text-blue-600">Services</a>
                <a href="/appointments/" class="hover:text-blue-600">Appointments</a>
                <a href="/contact/" class="hover:text-blue-600">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Page Content -->
    <main class="min-h-screen">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-blue-900 text-white text-center py-6 mt-10">
        <p>&copy; 2025 Imbumba Radiology Imaging. All rights reserved.</p>
    </footer>

</body>
</html>
