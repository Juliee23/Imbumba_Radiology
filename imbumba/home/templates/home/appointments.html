{% extends 'home/base.html' %}

{% block title %}Appointments | Imbumba Radiology Imaging {% endblock %}

{% block content %}

<section class="py-16 text-center">
    <h2 class="text-4xl font-semibold text-blue-800 mb-6">Book an Appointment</h2>
    <p class="text-lg text-gray-700 mb-10">Fill in your details below and our team will contact you soon.</p>
    <form class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md space-y-4">
        <input type="text" placeholder="Full Name" class="w-full border p-3 rounded-md" required>
        <input type="email" placeholder="Email Address" class="w-full border p-3 rounded-md" required>
        <input type="text" placeholder="Phone Number" class="w-full border p-3 rounded-md" required>
        <textarea placeholder="Preferred Date or Notes" class="w-full border p-3 rounded-md"></textarea>
        <button class="bg-blue-700 text-white px-6 py-3 rounded-lg hover:bg-blue-800">Submit</button>
    </form>
</section>

{% endblock %}
